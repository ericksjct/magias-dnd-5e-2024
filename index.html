<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Card Test</title>
<link rel="stylesheet" href="css/style.css">
<style>
    .spell-grid {
        columns: 2;
        column-gap: 5px;
        max-width: 20cm;
        margin: auto;
        margin-top: 20px;
    }
    .spell-item {
        break-inside: avoid;
        display: inline-block;
        width: 100%;
        background: transparent;
        margin-bottom: 5px;
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(0,0,0,0);
        transition: opacity 0.2s ease, transform 0.3s ease-out, box-shadow 0.3s ease-out;
    }
    .spell-item:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 6px 16px rgba(0,0,0,0.18);
        z-index: 2;
    }
    .spell-item:hover .spell-body {
        border-color: var(--accent) !important;
    }
    .spell-item.fading {
        opacity: 0;
    }
    .level-separator {
        transition: opacity 0.2s ease;
    }
    .level-separator.fading {
        opacity: 0;
    }
    .level-separator {
        column-span: all;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 12px 0;
        font-family: 'Roboto', sans-serif;
        font-size: 11pt;
        color: #666;
        user-select: none;
    }
    .level-separator::before,
    .level-separator::after {
        content: '';
        flex: 1;
        border-top: 1px dotted #aaa;
    }
    #menu-container { position: static; background: none; }
    #menu { margin: 20px auto 0; }
    #lang-flags {
        position: fixed;
        top: 0.6em;
        right: 1em;
        display: flex;
        gap: 0.2em;
        z-index: 20;
    }
    .flag-btn {
        font-size: 1.4em;
        background: none;
        border: 2px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        padding: 0.1em 0.2em;
        line-height: 1;
        opacity: 0.4;
        transition: opacity 0.15s, border-color 0.15s;
    }
    .flag-btn:hover { opacity: 0.7; }
    .flag-btn.active { opacity: 1; border-color: #aaa; }

    #legenda {
        position: fixed;
        bottom: 1em;
        right: 1em;
        background: #EEEEEE;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: 'Roboto', sans-serif;
        font-size: 10pt;
        z-index: 10;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    #legenda-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1em;
        padding: 0.4em 0.8em;
        cursor: pointer;
        user-select: none;
        font-weight: bold;
        color: #555;
    }
    #legenda-toggle span {
        font-size: 12pt;
        line-height: 1;
        transition: transform 0.2s ease;
    }
    #legenda.collapsed #legenda-toggle span {
        transform: rotate(180deg);
    }
    #legenda-body {
        padding: 0.3em 0.8em 0.6em;
        border-top: 1px solid #ccc;
        transition: max-height 0.25s ease, opacity 0.25s ease;
        max-height: 200px;
        opacity: 1;
        overflow: hidden;
    }
    #legenda.collapsed #legenda-body {
        max-height: 0;
        opacity: 0;
        border-top: none;
        padding-top: 0;
        padding-bottom: 0;
    }
    .legenda-item {
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin: 0.3em 0;
    }
    .legenda-item img {
        height: 1.2em;
    }
</style>
</head>
<body style="background:#ddd; padding: 20px;">

    <div id="menu-container">
        <div id="menu">
            <div class="menu-item">
                <select id="class-select" style="text-align-last:center;">
                    <option value="all" data-i18n="classe">Classe</option>
                </select>
            </div>
            <div style="width:1em"></div>
            <div class="menu-item">
                <select id="version-select" style="text-align-last:center;">
                    <option value="" data-i18n="versao">Versão</option>
                </select>
            </div>
            <div class="menu-space"></div>
            <div id="show-known" class="menu-item">
                <p data-i18n="conhecidas">Conhecidas</p>
                <img src="img/unknown.svg">
            </div>
        </div>
    </div>

    <div id="lang-flags">
        <button class="flag-btn active" data-lang="ptbr" title="PT-BR">🇧🇷</button>
        <button class="flag-btn" data-lang="en" title="EN">🇬🇧</button>
    </div>

    <div id="fetch-error" style="display:none; max-width:20cm; margin: 20px auto; padding: 1em; background:#f8d7da; border:1px solid #f5c2c7; border-radius:8px; font-family:helvetica,sans-serif; color:#842029;">
        ⚠️ Não foi possível carregar as magias. Abra a página pelo <strong>Live Server</strong> (botão "Go Live" no VS Code) em vez de abrir o arquivo diretamente.
    </div>

    <div class="spell-grid" id="spell-grid"></div>

    <div id="legenda">
        <div id="legenda-toggle">
            <span data-i18n="legenda">Legenda</span> <span>▲</span>
        </div>
        <div id="legenda-body">
            <div class="legenda-item"><img src="img/known.svg"> <span data-i18n="leg_known">Magia conhecida</span></div>
            <div class="legenda-item"><img src="img/outside.svg"> <span data-i18n="leg_outside">Conhecida, fora da classe</span></div>
            <div class="legenda-item"><img src="img/unknown.svg"> <span data-i18n="leg_unknown">Não conhecida</span></div>
            <div class="legenda-item"><img src="img/ritual.svg"> <span data-i18n="leg_ritual">Ritual</span></div>
            <div class="legenda-item"><img src="img/concentration.svg"> <span data-i18n="leg_concentration">Concentração</span></div>
        </div>
    </div>

    <script>
    var spells2 = [];
    var FADE = 200;
    var selectedClass = 'all';
    var onlyKnown = false;
    var knownSpells = {};

    var TIER_SYMBOLS = ['○','◆','◆◆','◆◆◆','◆◆◆◆','★','★★','★★★','✶','✶✶'];

    var LEVEL_COLORS = [
        '#BDBDBD',
        '#616161',
        '#00E676',
        '#021aee',
        '#d602ee',
        '#FF9800',
        '#ee6002',
        '#E91E63',
        '#C17900',
        '#00BFA5'
    ];

    function levelAccent(lvl) {
        return LEVEL_COLORS[lvl];
    }

    function isKnown(name) {
        return !!knownSpells[name];
    }

    function forClass(spell) {
        return selectedClass === 'all' || spell.classe.indexOf(selectedClass) >= 0;
    }

    function shouldShow(spell) {
        if (onlyKnown) return isKnown(spell.name);
        return forClass(spell) || isKnown(spell.name);
    }

    function knownIcon(spell) {
        if (isKnown(spell.name) && selectedClass !== 'all' && !forClass(spell)) return 'img/outside.svg';
        if (isKnown(spell.name)) return 'img/known.svg';
        return 'img/unknown.svg';
    }

    function levelLabel(level) {
        var t = i18n[currentLang];
        return level === 0 ? t.level_cantrip : t.level_n + level;
    }

    function buildCard(spell) {
        var card = document.createElement('div');
        card.className = 'grid-item spell-item';
        card.dataset.name = spell.name;
        card.dataset.level = spell.level;
        card.dataset.classe = spell.classe.join(',');

        var lvl = spell.level;
        card.style.setProperty('--accent', levelAccent(lvl));

        card.innerHTML =
            '<div class="spell-body">' +
                '<div class="title">' +
                    '<div class="name">' +
                        '<p>' + spell.displayName + '</p>' +
                        (spell.ritual ? '<img src="img/ritual.svg">' : '') +
                        '<p class="school">' + spell.school + '</p>' +
                    '</div>' +
                    '<div class="known"><img src="' + knownIcon(spell) + '"></div>' +
                '</div>' +
                '<div class="details">' +
                    '<div class="meta">' +
                        '<div class="meta-item"><img src="img/cast.svg"><div class="meta-content">' + spell.castTime + '</div></div>' +
                        '<div class="meta-item"><img src="img/range.svg"><div class="meta-content">' + spell.range + '</div></div>' +
                        '<div class="meta-item"><img src="img/components.svg"><div class="meta-content">' + spell.components + '</div></div>' +
                        '<div class="meta-item"><img src="img/duration.svg">' + (spell.concentration ? '<img src="img/concentration.svg">' : '') + '<div class="meta-content">' + spell.duration + '</div></div>' +
                    '</div>' +
                    '<div class="description">' + spell.description + '</div>' +
                '</div>' +
                '<div class="tier-badge" aria-label="Spell level ' + lvl + '">(' + lvl + ') ' + TIER_SYMBOLS[lvl] + '</div>' +
            '</div>';

        card.querySelector('.known').addEventListener('click', function() {
            knownSpells[spell.name] = !knownSpells[spell.name];
            card.querySelector('.known img').src = knownIcon(spell);
            if (onlyKnown) render();
        });

        return card;
    }

    function render() {
        var grid = document.getElementById('spell-grid');
        grid.innerHTML = '';

        var lastLevel = -1;
        spells2.forEach(function(spell) {
            if (spell.level !== lastLevel) {
                lastLevel = spell.level;
                var sep = document.createElement('div');
                sep.className = 'level-separator';
                sep.dataset.sepLevel = spell.level;
                sep.textContent = levelLabel(spell.level);
                grid.appendChild(sep);
            }
            grid.appendChild(buildCard(spell));
        });

        applyFilter(true);
    }

    function fadeOut(el) {
        if (el.style.display === 'none') return;
        el.classList.add('fading');
        setTimeout(function() {
            el.style.display = 'none';
            el.classList.remove('fading');
        }, FADE);
    }

    function fadeInAll(els) {
        els.forEach(function(el) {
            el.style.display = '';
            el.classList.add('fading');
        });
        void document.getElementById('spell-grid').offsetHeight; // único reflow
        els.forEach(function(el) { el.classList.remove('fading'); });
    }

    function applyFilter(instant) {
        var toShow = [];
        var toHide = [];

        document.querySelectorAll('.spell-item').forEach(function(card) {
            // atualiza ícone
            var spell = spells2.find(function(s) { return s.name === card.dataset.name; });
            if (spell) card.querySelector('.known img').src = knownIcon(spell);

            (shouldShow(spell) ? toShow : toHide).push(card);
        });

        document.querySelectorAll('.level-separator').forEach(function(sep) {
            var level = parseInt(sep.dataset.sepLevel);
            var hasVisible = spells2.some(function(s) {
                return s.level === level && shouldShow(s);
            });
            (hasVisible ? toShow : toHide).push(sep);
        });

        if (instant) {
            toHide.forEach(function(el) { el.style.display = 'none'; });
            toShow.forEach(function(el) { el.style.display = ''; });
        } else {
            toHide.forEach(fadeOut);
            setTimeout(function() { fadeInAll(toShow); }, FADE);
        }
    }

    document.getElementById('class-select').addEventListener('change', function() {
        selectedClass = this.value;
        applyFilter();
    });

    document.getElementById('show-known').addEventListener('click', function() {
        onlyKnown = !onlyKnown;
        this.querySelector('img').src = onlyKnown ? 'img/known.svg' : 'img/unknown.svg';
        applyFilter();
    });

    document.getElementById('legenda-toggle').addEventListener('click', function() {
        document.getElementById('legenda').classList.toggle('collapsed');
    });

    // Versões disponíveis — adicione aqui novos arquivos no futuro
    var VERSIONS = [
        { file: 'spells-ptbr', label: null },
        { file: 'spells-en',   label: null }
    ];

    var currentLang = 'ptbr';
    var currentClasses = [];

    var i18n = {
        ptbr: {
            classe:            'Classe',
            versao:            'Versão',
            conhecidas:        'Conhecidas',
            legenda:           'Legenda',
            leg_known:         'Magia conhecida',
            leg_outside:       'Conhecida, fora da classe',
            leg_unknown:       'Não conhecida',
            leg_ritual:        'Ritual',
            leg_concentration: 'Concentração',
            level_cantrip:     'Truques',
            level_n:           'Nível '
        },
        en: {
            classe:            'Class',
            versao:            'Version',
            conhecidas:        'Known',
            legenda:           'Legend',
            leg_known:         'Known spell',
            leg_outside:       'Known, outside class',
            leg_unknown:       'Unknown spell',
            leg_ritual:        'Ritual',
            leg_concentration: 'Concentration',
            level_cantrip:     'Cantrips',
            level_n:           'Level '
        }
    };

    function applyI18n() {
        var t = i18n[currentLang];
        document.querySelectorAll('[data-i18n]').forEach(function(el) {
            el.textContent = t[el.dataset.i18n] || el.textContent;
        });
    }

    function populateClassSelect() {
        selectedClass = 'all';
        var sel = document.getElementById('class-select');
        sel.innerHTML = '<option value="all">' + i18n[currentLang].classe + '</option>';
        currentClasses.forEach(function(cls) {
            var opt = document.createElement('option');
            opt.value = cls.key;
            opt.textContent = cls[currentLang] || cls.key;
            sel.appendChild(opt);
        });
    }

    function loadSpells(file) {
        fetch('js/' + file + '.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                document.getElementById('fetch-error').style.display = 'none';
                spells2 = data.spells;
                currentClasses = data.classes;
                populateClassSelect();
                render();
            })
            .catch(function() {
                document.getElementById('fetch-error').style.display = 'block';
            });
    }

    // Carrega versões disponíveis no select de versão
    function initVersions() {
        var versionSelect = document.getElementById('version-select');
        var loaded = 0;
        VERSIONS.forEach(function(v, i) {
            fetch('js/' + v.file + '.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    v.label = data.version;
                    loaded++;
                    if (loaded === VERSIONS.length) {
                        versionSelect.innerHTML = '';
                        VERSIONS.forEach(function(ver) {
                            var opt = document.createElement('option');
                            opt.value = ver.file;
                            opt.textContent = ver.label;
                            versionSelect.appendChild(opt);
                        });
                        loadSpells(VERSIONS[0].file);
                    }
                })
                .catch(function() {
                    document.getElementById('fetch-error').style.display = 'block';
                });
        });
    }

    document.getElementById('version-select').addEventListener('change', function() {
        loadSpells(this.value);
    });

    document.querySelectorAll('.flag-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            currentLang = this.dataset.lang;
            document.querySelectorAll('.flag-btn').forEach(function(b) {
                b.classList.toggle('active', b.dataset.lang === currentLang);
            });
            applyI18n();
            populateClassSelect();
            // Atualiza textos dos separadores de nível
            document.querySelectorAll('.level-separator').forEach(function(sep) {
                sep.textContent = levelLabel(parseInt(sep.dataset.sepLevel));
            });
            applyFilter(true);
        });
    });

    initVersions();
    </script>

</body>
</html>
